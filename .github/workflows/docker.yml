name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: miniflakedb/miniflake:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm -d --name miniflake-smoke -p 8084:8084 \
            miniflakedb/miniflake:ci
          # Wait for /health to come up (max 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8084/_miniflake/health >/dev/null 2>&1; then
              echo "health OK"
              break
            fi
            sleep 1
          done
          docker logs miniflake-smoke || true
          docker stop miniflake-smoke || true
