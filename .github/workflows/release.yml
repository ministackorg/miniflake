name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # for creating the GitHub Release

jobs:
  build:
    name: build ${{ matrix.target.label }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are billed at 10× rate against the free Actions
        # quota and DuckDB's cgo build burns 15–30 min per arch on a fresh
        # runner. macOS users go through `docker pull` or `make build`
        # instead. Re-add darwin here when the project moves off free tier
        # or when DuckDB ships native-arch wheels for go-duckdb.
        target:
          - { label: linux-amd64, runner: ubuntu-latest, goos: linux, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Compute version
        id: ver
        shell: bash
        run: |
          # Strip leading "v" from tag so the binary reports "0.1.0", not "v0.1.0".
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          VERSION: ${{ steps.ver.outputs.version }}
          COMMIT: ${{ steps.ver.outputs.commit }}
        run: |
          mkdir -p dist
          out="dist/miniflake-${VERSION}-${{ matrix.target.label }}"
          go build \
            -ldflags "-s -w -X main.version=$VERSION -X main.commit=$COMMIT" \
            -o "$out" ./cmd/miniflake

      - name: Sanity check binary
        if: matrix.target.goos == runner.os || (matrix.target.goos == 'linux' && runner.os == 'Linux') || (matrix.target.goos == 'darwin' && runner.os == 'macOS')
        shell: bash
        run: |
          out="dist/miniflake-${{ steps.ver.outputs.version }}-${{ matrix.target.label }}"
          file "$out"
          # Architecture must match GOARCH — if go cross-compiled, refuse.
          if [ "${{ matrix.target.goarch }}" = "amd64" ]; then
            file "$out" | grep -q "x86_64\|x86-64" || (echo "expected amd64 binary"; exit 1)
          else
            file "$out" | grep -q "arm64\|aarch64" || (echo "expected arm64 binary"; exit 1)
          fi
          # Only invoke --version on the native arch.
          if [ "${{ matrix.target.label }}" = "linux-amd64" ] && [ "$(uname -m)" = "x86_64" ]; then
            "$out" --version
          fi

      - name: Compute checksum
        shell: bash
        run: |
          out="dist/miniflake-${{ steps.ver.outputs.version }}-${{ matrix.target.label }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "$out" > "$out.sha256"
          else
            shasum -a 256 "$out" > "$out.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniflake-${{ matrix.target.label }}
          path: |
            dist/miniflake-${{ steps.ver.outputs.version }}-${{ matrix.target.label }}
            dist/miniflake-${{ steps.ver.outputs.version }}-${{ matrix.target.label }}.sha256

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate checksums
        shell: bash
        run: |
          cd dist
          cat *.sha256 > checksums.txt
          ls -la

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull the section for this version out of CHANGELOG.md so the
          # GitHub Release body matches what's committed.
          awk -v ver="$version" '
            /^## \[/ {
              if (capture) exit
              if (index($0, "[" ver "]")) { capture = 1; next }
            }
            capture { print }
          ' CHANGELOG.md > release_notes.md
          if ! [ -s release_notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/miniflake-*-linux-amd64
            dist/miniflake-*.sha256
            dist/checksums.txt
